<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --bg-sunken: #f6f8fa; --bg-raised: #ffffff;
    --fg: #1f2328; --fg-muted: #59636e; --fg-faint: #818b98;
    --line: #d1d9e0; --line-strong: #b7bfc8;
    --accent: #0550ae; --accent-fg: #ffffff; --accent-soft: #ddf4ff;
    --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --urgent: #bc4c00;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --bg-sunken: #010409; --bg-raised: #151b23;
      --fg: #e6edf3; --fg-muted: #9198a1; --fg-faint: #6e7681;
      --line: #3d444d; --line-strong: #545d68;
      --accent: #4493f8; --accent-fg: #0d1117; --accent-soft: #121d2f;
      --ok: #3fb950; --warn: #d29922; --bad: #f85149; --urgent: #db6d28;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg-sunken); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -0.01em; }
  h1 { font-size: 1.15rem; font-weight: 700; }
  h2 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-muted); }
  h3 { font-size: .95rem; font-weight: 650; }
  code, pre, .mono { font-family: var(--mono); font-size: .82em; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 72px; }

  header.bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px; margin-bottom: 20px;
  }
  .bar-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
  .brand .v { font-family: var(--mono); font-size: .72rem; color: var(--fg-faint); }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    font-size: .75rem; font-weight: 600; background: var(--bg-raised); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .pill.hot { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 45%, var(--line)); }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line-strong);
    background: var(--bg-raised); color: var(--fg);
  }
  button:hover:not(:disabled) { border-color: var(--fg-muted); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  button.sm { padding: 3px 9px; font-size: .78rem; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }

  section.panel {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .panel > header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .panel > header .spacer { margin-left: auto; }

  .tile { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .tile .n { font-size: 1.85rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); font-weight: 650; }
  .tile .sub { font-size: .72rem; color: var(--fg-faint); margin-top: 2px; }
  .tile.hot .n { color: var(--urgent); }
  .tile-note { grid-column: 1 / -1; font-size: .78rem; color: var(--fg-faint); padding: 2px 2px 0; }

  .rows { display: flex; flex-direction: column; }
  .row { padding: 11px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .row:first-child { border-top: 0; }
  .row .grow { min-width: 0; flex: 1; }
  .row .title { font-weight: 620; overflow-wrap: anywhere; }
  .row .meta { color: var(--fg-muted); font-size: .8rem; overflow-wrap: anywhere; }
  .row .when { color: var(--fg-faint); font-size: .74rem; font-family: var(--mono); white-space: nowrap; }

  .chip {
    font-size: .68rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg-sunken); color: var(--fg-muted); white-space: nowrap;
  }
  .chip.INTERVIEW { color: var(--urgent); border-color: var(--urgent); background: transparent; }
  .chip.NEW_REQ, .chip.RTR_REQUEST, .chip.RATE_CONFIRM { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .chip.REJECTION, .chip.ACK, .chip.JOB_ALERT, .chip.NEWSLETTER { color: var(--fg-faint); }

  .draft {
    background: var(--bg-sunken); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 10px; margin-top: 8px; max-height: 15em; overflow: auto;
  }
  textarea {
    width: 100%; min-height: 11em; font-family: var(--mono); font-size: .82rem;
    background: var(--bg-sunken); color: var(--fg); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 9px; resize: vertical;
  }

  .toggle { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .toggle:first-of-type { border-top: 0; }
  .toggle .grow { flex: 1; min-width: 0; }
  .toggle .hint { font-size: .76rem; color: var(--fg-muted); }
  input[type="number"], input[type="text"] {
    font: inherit; width: 6.5em; padding: 4px 7px; border-radius: 6px;
    border: 1px solid var(--line-strong); background: var(--bg-sunken); color: var(--fg);
  }
  input[type="text"] { width: 100%; max-width: 22em; }

  .banner { border-radius: var(--radius); padding: 13px 15px; margin-bottom: 16px; border: 1px solid; }
  .banner.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--bg-raised)); }
  .banner.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--bg-raised)); }
  .banner.info { border-color: var(--accent); background: var(--accent-soft); }
  .banner b { display: block; margin-bottom: 3px; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }

  .empty { color: var(--fg-muted); padding: 18px 0; text-align: center; }
  .qr { display: block; width: 210px; height: 210px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .toast {
    position: fixed; inset-inline: 0; bottom: 18px; margin: 0 auto; width: max-content; max-width: 92vw;
    background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-weight: 600; font-size: .84rem; z-index: 50; box-shadow: 0 6px 24px rgb(0 0 0 / .22);
  }
  /* tabs — the top-level navigation */
  .tabs-bar { max-width: 1180px; margin: 10px auto -1px; padding: 0 16px; display: flex; gap: 2px; flex-wrap: wrap; }
  .tabs-bar button {
    border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--fg-muted);
    border-radius: 8px 8px 0 0; padding: 8px 16px; font-weight: 650; font-size: .88rem;
  }
  .tabs-bar button:hover { color: var(--fg); background: var(--bg-sunken); }
  .tabs-bar button.on {
    background: var(--bg-sunken); color: var(--fg);
    border-color: var(--line); border-bottom: 1px solid var(--bg-sunken);
  }
  .view { display: none; }
  .view.on { display: block; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

  /* setup wizard */
  .frow { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 11px; }
  .frow > label { font-weight: 620; font-size: .88rem; }
  .frow input[type="text"], .frow input[type="email"], .frow input[type="tel"],
  .frow input[type="password"], .frow input[type="number"] { width: 100%; max-width: 26rem; }
  @media (max-width: 620px) { .frow { grid-template-columns: 1fr; gap: 4px; } }
  label.radio { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; font-weight: 500; cursor: pointer; }
  label.radio input { margin: 0; }
  .steps { margin: 0 0 14px; padding-left: 20px; color: var(--fg-muted); font-size: .86rem; }
  .steps li { margin-bottom: 5px; }
  summary { cursor: pointer; }
  summary:hover { color: var(--fg); }
  #setupPanel { border-color: var(--accent); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <div class="brand"><h1>Inbox Agent</h1><span class="v">v__VERSION__</span></div>
    <span class="pill" id="watcherPill"><span class="dot warn"></span> checking…</span>
    <span class="spacer"></span>
    <button id="runBtn" class="sm">Check mail now</button>
    <button id="pauseBtn" class="sm">…</button>
  </div>
  <nav class="tabs-bar" id="tabs">
    <button data-tab="inbox" class="on">Inbox</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="system">System</button>
  </nav>
</header>

<div class="wrap">
  <div id="banners"></div>

  <section class="panel" id="setupPanel" hidden>
    <header><h2 id="setupTitle">Setup</h2><span class="spacer"></span><span class="pill" id="setupStep"></span></header>
    <div id="setup"></div>
  </section>

  <!-- Four views instead of eleven stacked panels. Everything you look at daily
       is on Inbox; everything you set once is behind Settings or System. -->

  <section class="view on" data-view="inbox">
    <div class="grid cards" id="tiles"></div>

    <section class="panel">
      <header>
        <h2>Waiting on you</h2>
        <span class="spacer"></span>
        <span class="pill" id="pendingCount">0</span>
      </header>
      <div id="pending"></div>
    </section>

    <section class="panel">
      <header>
        <h2>Recent mail</h2>
        <span class="spacer"></span>
        <div class="chips" id="streamTabs">
          <button data-cat="" aria-pressed="true" class="sm">All</button>
          <button data-cat="INTERVIEW" class="sm">Interviews</button>
          <button data-cat="NEW_REQ" class="sm">Reqs</button>
          <button data-cat="RTR_REQUEST" class="sm">RTR</button>
          <button data-cat="REJECTION" class="sm">Rejections</button>
        </div>
      </header>
      <div class="rows" id="stream"></div>
    </section>
  </section>

  <section class="view" data-view="activity">
    <section class="panel">
      <header><h2>Submissions on record</h2></header>
      <div class="rows" id="subs"></div>
    </section>

    <section class="panel">
      <header><h2>Duplicates &amp; collisions</h2></header>
      <div class="rows" id="dupes"></div>
    </section>
  </section>

  <section class="view" data-view="settings">
    <section class="panel">
      <header><h2>How the agent behaves</h2></header>
      <div id="policy"></div>
    </section>

    <section class="panel">
      <header><h2>Your details</h2></header>
      <div id="profile"></div>
    </section>

    <section class="panel">
      <header><h2>Onboarding details</h2></header>
      <div id="onboarding"></div>
    </section>
  </section>

  <section class="view" data-view="system">
    <section class="panel">
      <header><h2>Inboxes</h2><span class="spacer"></span><span class="mono" id="acctCount"></span></header>
      <div class="rows" id="accounts"></div>
    </section>

    <section class="panel">
      <header><h2>Telegram</h2></header>
      <div id="telegram"></div>
    </section>

    <section class="panel">
      <header><h2>Reply templates</h2></header>
      <div class="rows" id="templates"></div>
    </section>
  </section>
</div>

<script>
'use strict';
const CSRF = '__CSRF_TOKEN__';
let state = { overview: null, streamCat: '', tab: 'inbox' };
let timer = null;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(text) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const node = document.createElement('div');
  node.className = 'toast';
  node.textContent = text;
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 3200);
}

async function get(path) {
  const response = await fetch('/api/' + path, { headers: { accept: 'application/json' } });
  const body = await response.json().catch(() => ({ ok: false, error: 'bad JSON' }));
  if (!body.ok) throw new Error(body.error || 'request failed');
  return body.data;
}

async function post(name, payload = {}) {
  const response = await fetch('/api/action/' + name, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-aim-csrf': CSRF },
    body: JSON.stringify(payload)
  });
  const body = await response.json().catch(() => ({ ok: false, error: 'bad JSON' }));
  if (body.ok === false) throw new Error(body.error || 'action failed');
  return body;
}

/**
 * True when a panel must not be re-rendered right now.
 *
 * The dashboard polls every 15s and rebuilds panels from innerHTML. Any form the
 * user is part-way through filling gets destroyed by that — type an email
 * address, look away, and it is gone. So a panel holding focus or holding typed
 * input is left alone until it is empty and unfocused again.
 */
function isBusy(hostId) {
  const host = $(hostId);
  if (!host) return false;
  if (host.contains(document.activeElement) && document.activeElement !== document.body) return true;
  for (const input of host.querySelectorAll('input, textarea')) {
    if (input.type === 'checkbox' || input.type === 'radio') continue;
    if (String(input.value || '').trim() !== '') return true;
  }
  return false;
}

function timeAgo(iso) {
  if (!iso) return 'never';
  const seconds = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (!Number.isFinite(seconds)) return 'never';
  if (seconds < 60) return Math.round(seconds) + 's ago';
  if (seconds < 3600) return Math.round(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h ago';
  return Math.round(seconds / 86400) + 'd ago';
}

function rateText(rate) {
  if (!rate) return '';
  const n = (v) => '$' + Number(v).toLocaleString('en-US');
  const suffix = rate.kind === 'hourly' ? '/hr' : '';
  return rate.max > rate.min ? n(rate.min) + '-' + n(rate.max) + suffix : n(rate.min) + suffix;
}

/* ---------- render ---------- */

/**
 * One status pill, not three.
 *
 * Three pills competing in the header meant reading all of them to answer the only
 * question that matters — is it working right now? This collapses to a single
 * verdict, with the detail moved to the pill's tooltip and the Settings tab.
 */
function renderHeader(data) {
  const w = data.watcher;
  const pill = $('watcherPill');

  let dot = 'ok';
  let label = 'Watching your inbox';
  let detail = 'The watcher is running and your mail is being read.';

  if (data.config.paused) {
    dot = 'warn';
    label = 'Paused';
    detail = 'Nothing is being sent or archived. Interview alerts still come through.';
  } else if (!w.alive) {
    dot = 'bad';
    label = w.ageSeconds === null ? 'Not started' : 'Not watching';
    detail = 'The background watcher is not running, so no mail is being read.';
  } else if (data.config.autoSend) {
    label = 'Watching · auto-send on';
    detail = 'Replies go out without asking when every gate passes.';
  }

  pill.innerHTML = '<span class="dot ' + dot + '"></span> ' + esc(label);
  pill.className = 'pill ' + (dot === 'ok' ? 'ok' : dot === 'warn' ? 'warn' : 'bad');
  pill.title = detail + (data.channels.length ? ' Alerts via ' + data.channels.join(' + ') + '.' : ' No alert channel configured.');

  $('pauseBtn').textContent = data.config.paused ? 'Resume' : 'Pause';
  $('pauseBtn').className = 'sm ' + (data.config.paused ? 'primary' : '');
}

function renderBanners(data) {
  const out = [];
  // During first-run setup the wizard IS the instruction, so config complaints
  // that setup is about to resolve would only be noise. A user who just installed
  // this should see one thing to do, not a wall of errors about it.
  const inSetup = data.needsSetup || !data.profile.fullName;

  if (!inSetup && data.validation && !data.validation.ok) {
    out.push('<div class="banner bad"><b>Configuration problem</b><ul>' +
      data.validation.errors.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>');
  }
  if (!inSetup && data.validation && data.validation.warnings.length) {
    out.push('<div class="banner warn"><b>Worth knowing</b><ul>' +
      data.validation.warnings.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>');
  }
  if (data.update && data.update.behind) {
    out.push('<div class="banner info"><b>Version ' + esc(data.update.latest) + ' is available</b>' +
      'You are running ' + esc(data.update.current) + '. ' +
      (data.update.installerUrl
        ? '<a href="' + esc(data.update.installerUrl) + '">Download the installer</a> and run it over the top — your config, ledger and <code>.env</code> are preserved.'
        : '<a href="' + esc(data.update.url) + '">See the release notes</a>.') +
      '</div>');
  }
  if (!data.watcher.alive && !inSetup) {
    out.push('<div class="banner warn"><b>Not watching your mail right now.</b>' +
      'The background watcher is not running. <button class="sm primary" id="bannerStart">Start it</button></div>');
  }
  const broken = data.accounts.filter((a) => a.enabled && (!a.authorized || a.lastError));
  if (broken.length && !inSetup) {
    out.push('<div class="banner bad"><b>' + broken.length + ' inbox' + (broken.length === 1 ? '' : 'es') + ' need attention</b><ul>' +
      broken.map((a) => '<li>' + esc(a.label) + ': ' +
        esc(a.lastError || 'not connected yet') +
        (a.transport === 'gmail' && !a.authorized
          ? ' <button class="sm" data-gauth="' + esc(a.id) + '">Authorize</button>'
          : ' <button class="sm" data-fixpw="' + esc(a.id) + '">Update password</button>') +
        '</li>').join('') + '</ul></div>');
  }
  $('banners').innerHTML = out.join('');

  const startBtn = $('bannerStart');
  if (startBtn) startBtn.onclick = async () => {
    startBtn.disabled = true; startBtn.textContent = 'Starting…';
    try { await post('startAgent'); toast('Watching your inbox again.'); }
    catch (error) { toast(error.message); }
    refresh();
  };

  document.querySelectorAll('[data-gauth]').forEach((button) => {
    button.onclick = async () => {
      try {
        const result = await post('gmailAuthUrl', { id: button.dataset.gauth });
        if (result.url) { window.open(result.url, '_blank', 'noreferrer'); toast('Approve access in the new tab.'); }
      } catch (error) { toast(error.message); }
    };
  });

  document.querySelectorAll('[data-fixpw]').forEach((button) => {
    button.onclick = () => {
      const id = button.dataset.fixpw;
      const value = window.prompt('App password for this inbox:');
      if (!value) return;
      post('setSecret', { key: 'IMAP_PASSWORD', accountId: id, value })
        .then(() => post('testAccount', { id }))
        .then((test) => toast(test.ok ? 'Connected.' : 'Saved, but the test still fails.'))
        .catch((error) => toast(error.message))
        .finally(refresh);
    };
  });
}

function renderTiles(data) {
  const s = data.stats24h;
  const week = data.stats7d;

  // Four numbers, not eight. Eight tiles of mostly zeros is a wall to scan past;
  // these are the only ones that change what you do next. The rest moved into the
  // subtitle underneath, where they inform without competing.
  const tiles = [
    { k: 'interview requests', n: s.interviews, sub: 'last 24h', hot: s.interviews > 0 },
    { k: 'new requirements', n: s.newReqs, sub: 'last 24h' },
    { k: 'waiting on you', n: s.pending, sub: 'drafts to approve', hot: s.pending > 0 },
    { k: 'noise archived', n: s.archived, sub: 'last 24h' }
  ];

  $('tiles').innerHTML = tiles.map((t) =>
    '<div class="tile' + (t.hot ? ' hot' : '') + '"><div class="n">' + t.n + '</div>' +
    '<div class="k">' + esc(t.k) + '</div>' +
    '<div class="sub">' + esc(t.sub) + '</div></div>'
  ).join('') +
  '<div class="tile-note">' +
  s.processed + ' processed in 24h · ' + week.processed + ' this week · ' +
  s.sent + ' replied · ' + s.duplicates + ' duplicates caught' +
  '</div>';
}

function renderAccounts(data) {
  $('acctCount').textContent = data.accounts.length + ' configured';
  if (!data.accounts.length) { $('accounts').innerHTML = '<div class="empty">No inboxes yet — add one above.</div>'; return; }
  $('accounts').innerHTML = data.accounts.map((a) => {
    const bad = !a.enabled ? 'warn' : (a.authorized && !a.lastError) ? 'ok' : 'bad';
    return '<div class="row">' +
      '<span class="dot ' + bad + '" style="margin-top:6px"></span>' +
      '<div class="grow"><div class="title">' + esc(a.label) + ' <span class="chip">' + esc(a.transport) + '</span>' +
      (a.enabled ? '' : ' <span class="chip">disabled</span>') + '</div>' +
      '<div class="meta">' + esc(a.email) + ' · synced ' + timeAgo(a.lastSyncAt) + ' · every ' + a.pollSeconds + 's' +
      (a.lastError ? '<br><span style="color:var(--bad)">' + esc(a.lastError) + '</span>' : '') +
      (!a.authorized ? '<br><span style="color:var(--bad)">not connected yet</span>' : '') +
      '</div></div>' +
      '<button class="sm" data-test="' + esc(a.id) + '">Test</button>' +
      '<button class="sm danger" data-del="' + esc(a.id) + '">Remove</button>' +
      '</div>';
  }).join('');
  document.querySelectorAll('[data-test]').forEach((button) => {
    button.onclick = async () => {
      button.disabled = true; button.textContent = '…';
      try {
        const result = await post('testAccount', { id: button.dataset.test });
        toast(result.ok ? 'Connected: ' + (result.email || 'ok') : 'Failed: ' + (result.error || ''));
      } catch (error) { toast('Failed: ' + error.message); }
      button.disabled = false; button.textContent = 'Test';
      refresh();
    };
  });
  document.querySelectorAll('[data-del]').forEach((button) => {
    button.onclick = async () => {
      if (!confirm('Remove this inbox? Its stored password is deleted too. Your submission history is kept.')) return;
      try { await post('deleteAccount', { id: button.dataset.del }); toast('Inbox removed.'); }
      catch (error) { toast(error.message); }
      refresh();
    };
  });

  // "Add another inbox" lives with the account list once setup is done.
  if (!$('addAnother')) {
    $('accounts').insertAdjacentHTML('afterend',
      '<div style="margin-top:12px"><button class="sm" id="addAnother">Add another inbox</button></div>');
  }
  const addAnother = $('addAnother');
  if (addAnother) addAnother.onclick = () => {
    setup.step = 1;
    setup.hostGuess = null;
    setup.addingExtra = true;
    $('setupPanel').hidden = false;
    $('setup').innerHTML = '';
    renderSetupInbox(data);
    $('setupPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
}

function renderPending(rows) {
  // An in-progress reply edit lives in this panel; do not discard it.
  if (isBusy('pending')) return;
  $('pendingCount').textContent = rows.length;
  $('pendingCount').className = 'pill ' + (rows.length ? 'hot' : 'ok');
  if (!rows.length) { $('pending').innerHTML = '<div class="empty">Nothing waiting. Everything was handled or archived.</div>'; return; }

  $('pending').innerHTML = rows.map((row) => {
    const f = row.fields || {};
    const bits = [f.client && 'Client: ' + esc(f.client), f.agency && 'Agency: ' + esc(f.agency),
      f.workMode && f.workMode !== 'unknown' && esc(f.workMode), rateText(f.rate) && esc(rateText(f.rate))].filter(Boolean);
    return '<div class="row" data-out="' + esc(row.id) + '">' +
      '<div class="grow">' +
      '<div class="title"><span class="chip ' + esc(row.category) + '">' + esc(row.templateLabel || row.template) + '</span> ' + esc(f.title || row.subject) + '</div>' +
      '<div class="meta">→ ' + esc(row.to) + ' · ' + esc(row.account) + ' · ' + timeAgo(row.ts) + (bits.length ? '<br>' + bits.join(' · ') : '') + '</div>' +
      (row.blockedBy ? '<div class="meta" style="color:var(--warn)">held: ' + esc(row.blockedBy) + '</div>' : '') +
      (row.body ? '<div class="draft"><pre>' + esc(row.body) + '</pre></div>' : '<div class="meta" style="color:var(--bad)">No draft — template could not be filled.</div>') +
      '<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">' +
      (row.body ? '<button class="sm primary" data-send="' + esc(row.id) + '">Send</button>' +
                  '<button class="sm" data-edit="' + esc(row.id) + '">Edit</button>' : '') +
      '<button class="sm" data-skip="' + esc(row.id) + '">Skip</button>' +
      '</div></div></div>';
  }).join('');

  document.querySelectorAll('[data-send]').forEach((button) => {
    button.onclick = async () => {
      if (!confirm('Send this reply now?')) return;
      button.disabled = true;
      try { await post('sendOutbound', { id: button.dataset.send }); toast('Sent.'); }
      catch (error) { toast('Not sent: ' + error.message); }
      refresh();
    };
  });
  document.querySelectorAll('[data-skip]').forEach((button) => {
    button.onclick = async () => {
      try { await post('skipOutbound', { id: button.dataset.skip }); toast('Skipped.'); }
      catch (error) { toast(error.message); }
      refresh();
    };
  });
  document.querySelectorAll('[data-edit]').forEach((button) => {
    button.onclick = () => {
      const host = button.closest('[data-out]');
      const draft = host.querySelector('.draft');
      const current = draft ? draft.textContent : '';
      draft.outerHTML = '<textarea id="edit-' + button.dataset.edit + '"></textarea>' +
        '<div style="display:flex;gap:7px;margin-top:7px"><button class="sm primary" data-save="' + button.dataset.edit + '">Save draft</button></div>';
      const area = document.getElementById('edit-' + button.dataset.edit);
      area.value = current;
      area.focus();
      host.querySelector('[data-save]').onclick = async () => {
        try { await post('editOutbound', { id: button.dataset.edit, body: area.value }); toast('Draft saved.'); }
        catch (error) { toast(error.message); }
        refresh();
      };
    };
  });
}

function renderStream(rows) {
  if (!rows.length) { $('stream').innerHTML = '<div class="empty">No messages processed yet.</div>'; return; }
  $('stream').innerHTML = rows.slice(0, 60).map((row) => {
    const f = row.fields || {};
    const extra = [f.client, f.agency, f.workMode !== 'unknown' && f.workMode, rateText(f.rate)].filter(Boolean).map(esc).join(' · ');
    return '<div class="row">' +
      '<span class="chip ' + esc(row.category) + '">' + esc(row.category) + '</span>' +
      '<div class="grow"><div class="title">' + esc(f.title || row.subject || '(no subject)') + '</div>' +
      '<div class="meta">' + esc(row.fromName || row.from) + ' · ' + esc(row.account) +
      ' · ' + Math.round((row.confidence || 0) * 100) + '% ' + esc(row.decidedBy || '') +
      ' · <span class="mono">' + esc(row.action || '') + '</span>' + (row.archived ? ' · archived' : '') +
      (extra ? '<br>' + extra : '') +
      (row.duplicateVerdict !== 'new' ? '<br><span style="color:var(--warn)">' + esc(row.duplicateSummary || row.duplicateVerdict) + '</span>' : '') +
      '</div></div>' +
      '<span class="when">' + timeAgo(row.ts) + '</span></div>';
  }).join('');
}

function renderDupes(rows) {

  $('dupes').innerHTML = rows.slice(0, 25).map((row) =>

    '<div class="grow"><div class="title">' + esc(row.title || '(untitled)') + '</div>' +
    '<div class="meta">' + esc(row.summary || '') + '<br>from ' + esc(row.agency || row.from) + '</div></div>' +
    '<span class="when">' + timeAgo(row.ts) + '</span></div>'
  ).join('');
}

function renderSubs(rows) {
  if (!rows.length) { $('subs').innerHTML = '<div class="empty">No submissions logged yet. One appears each time an interest or RTR reply goes out.</div>'; return; }
  $('subs').innerHTML = rows.slice(0, 25).map((row) =>
    '<div class="row"><div class="grow"><div class="title">' + esc(row.title || '(untitled)') + '</div>' +
    '<div class="meta">' + esc(row.client || 'client not named') + ' via ' + esc(row.agency || row.recruiter) +
    ' · ' + esc(row.account) + (row.rate ? ' · ' + esc(rateText(row.rate)) : '') + '</div></div>' +

  const t = data.telegram;
  if (!data.secrets.telegramToken) {
    $('telegram').innerHTML =
      '<ol class="steps"><li>Open Telegram and message <a href="https://t.me/botfather" target="_blank" rel="noreferrer">@BotFather</a></li>' +
      '<li>Send <code>/newbot</code> and pick any name</li><li>Paste the token below</li></ol>' +
      '<div style="display:flex;gap:7px;flex-wrap:wrap"><input type="password" id="tgTokenInput" placeholder="8412345678:AA…" autocomplete="off">' +
      '<button class="sm primary" id="tgTokenSave">Save</button></div>';
    $('tgTokenSave').onclick = async () => {
      const value = $('tgTokenInput').value.trim();
      if (!value) { toast('Paste the token first.'); return; }
      try { await post('setSecret', { key: 'TG_TOKEN', value }); toast('Token saved.'); }
      catch (error) { toast(error.message); }
      refresh();
    };
    return;
  }
  if (t.paired) {
    $('telegram').innerHTML = '<div class="toggle"><div class="grow"><b>Paired</b>' +
      '<div class="hint">chat ' + esc(t.chatIdMasked) + ' · alerts ' + (t.enabled ? 'on' : 'off') + '</div></div>' +
      '<button class="sm danger" id="unpairBtn">Unpair</button></div>' +
      '<div class="hint" style="margin-top:8px">Message the bot anything — “how many reqs this week?” — or use /help for commands.</div>';
    $('unpairBtn').onclick = async () => {
      if (!confirm('Unpair this Telegram chat?')) return;
      await post('unpair'); toast('Unpaired.'); refresh();
    };
    return;
  }
  $('telegram').innerHTML = '<p class="hint" style="margin:0 0 10px">Scan this with your phone. It opens the bot and pairs this install automatically — no chat ID to copy.</p>' +
    '<div id="qrHost"></div><button class="sm primary" id="qrBtn" style="margin-top:10px">Generate pairing QR</button>';
  $('qrBtn').onclick = async () => {
    $('qrBtn').disabled = true;
    try {
      const result = await post('pairingLink');
      $('qrHost').innerHTML = '<img class="qr" alt="Telegram pairing QR code" src="' + result.qrDataUrl + '">' +
        '<div class="hint" style="margin-top:8px">Or open: <a href="' + esc(result.link) + '">' + esc(result.link) + '</a><br>Single use — it expires once claimed.</div>';
    } catch (error) { toast(error.message); }

  };

function toggleRow(label, hint, checked, handler, extra) {
  const id = 'tg-' + Math.random().toString(36).slice(2, 9);
  setTimeout(() => {
    const node = document.getElementById(id);
    if (node) node.onchange = () => handler(node.checked);
  }, 0);
  return '<div class="toggle"><div class="grow"><b>' + esc(label) + '</b><div class="hint">' + hint + '</div></div>' +
    (extra || '') + '<input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + '></div>';
}

  if (isBusy('policy')) return;
  const c = data.config;
  const wrap = async (name, value, message) => {
    try { await post(name, value); toast(message); } catch (error) { toast(error.message); }
    refresh();
  };

  $('policy').innerHTML =
    toggleRow('Auto-send', 'Reply without asking when every gate passes. Interviews are never auto-replied.', c.autoSend,
      (on) => wrap('autosend', { enabled: on }, on ? 'Auto-send on.' : 'Auto-send off.')) +
    toggleRow('Auto-archive', 'Move rejections and receipts out of the inbox. Labelled, never deleted.', c.autoArchive,
      (on) => wrap('autoarchive', { enabled: on }, 'Saved.')) +
    toggleRow('Remote only', 'Onsite roles get a decline draft instead of interest.', c.remoteOnly,
      (on) => wrap('remoteOnly', { enabled: on }, 'Saved.')) +
    toggleRow('Allow hybrid', 'Treat hybrid as acceptable when remote-only is on.', c.allowHybrid,
      (on) => wrap('allowHybrid', { enabled: on }, 'Saved.')) +
    toggleRow('Dedupe', 'Flag the same req across every inbox, and collisions at one client.', c.dedupeEnabled,
      (on) => wrap('dedupeEnabled', { enabled: on }, 'Saved.')) +
    toggleRow('Claude classifier', data.secrets.anthropicKey ? 'Model breaks ties the rules cannot settle.' : '<span style="color:var(--warn)">Add a Claude API key below to enable</span>', c.aiEnabled,
      (on) => wrap('aiEnabled', { enabled: on }, 'Saved.')) +

    '<input type="number" id="floorInput" min="0" step="5" value="' + (c.rateFloorHourly || 0) + '"><button class="sm" id="floorBtn">Set</button></div>' +
    '<div class="toggle"><div class="grow"><b>Min confidence</b><div class="hint">Auto-send needs at least this. 0.85 is a sane floor.</div></div>' +
    '<input type="number" id="confInput" min="0" max="1" step="0.01" value="' + (c.minConfidence || 0) + '"><button class="sm" id="confBtn">Set</button></div>' +
    '<div class="toggle"><div class="grow"><b>Block a domain</b><div class="hint">' +
    (c.blocklistDomains.length ? esc(c.blocklistDomains.join(', ')) : 'None blocked.') + '</div></div></div>' +
    '<div style="display:flex;gap:7px"><input type="text" id="blockInput" placeholder="agency.com"><button class="sm" id="blockBtn">Block</button></div>';

  const fields = [['fullName', 'Full name'], ['phone', 'Phone'], ['city', 'City'], ['state', 'State'],
    ['workAuth', 'Work authorization'], ['availability', 'Availability'], ['linkedin', 'LinkedIn'], ['preferredRateHourly', 'Preferred hourly rate']];

    ).join('') +
    '<button class="sm primary" id="profileBtn" style="margin-top:10px">Save profile</button>' +

  $('profileBtn').onclick = async () => {
    const payload = {};
    document.querySelectorAll('[data-profile]').forEach((input) => { if (input.value.trim()) payload[input.dataset.profile] = input.value.trim(); });

/* ---------- first-run setup ---------- */

const setup = { step: 1, hostGuess: null, busy: false };

function field(id, label, value, placeholder, type) {
  return '<div class="frow"><label for="' + id + '">' + esc(label) + '</label>' +
    '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value || '') +
    '" placeholder="' + esc(placeholder || '') + '" autocomplete="off" spellcheck="false"></div>';
}

/**
 * Moves to another step. Blanks the panel first: the busy-guard that protects
 * half-filled forms would otherwise refuse to re-render, leaving the user staring
 * at the step they just completed.
 */
function advanceSetup(step) {
  setup.step = step;
  setup.hostGuess = null;
  const host = $('setup');
  if (host) host.innerHTML = '';
  refresh();
}

async function setupPost(name, payload, okMessage) {
  if (setup.busy) return null;
  setup.busy = true;
  try {
    const result = await post(name, payload);
    if (okMessage) toast(okMessage);
    return result;
  } catch (error) {
    toast(error.message);
    return null;
  } finally {
    setup.busy = false;
  }
}

function renderSetup(data) {
  const panel = $('setupPanel');
  const hasAccount = data.accounts.length > 0;
  const hasProfile = Boolean(data.profile.fullName);

  // Never rebuild a form the user is in the middle of. The wizard is the one
  // place where losing typed input is unforgivable — it is the first thing anyone
  // touches after installing.
  if (!panel.hidden && isBusy('setup')) return;

  // Adding an extra inbox later reuses the same panel, but must not restart or
  // re-run the whole wizard.
  if (setup.addingExtra) {
    panel.hidden = false;
    $('setupStep').textContent = 'new inbox';
    $('setupTitle').textContent = 'Add another inbox';
    return renderSetupInbox(data);
  }

  // Advance past steps already satisfied, so a reload does not restart the flow.
  if (setup.step === 1 && hasAccount) setup.step = 2;
  if (setup.step === 2 && hasProfile) setup.step = 3;

  const done = hasAccount && hasProfile && setup.step > 3;
  if (done) { panel.hidden = true; return; }
  panel.hidden = false;

  $('setupStep').textContent = 'step ' + Math.min(setup.step, 3) + ' of 3';
  $('setupTitle').textContent = hasAccount ? 'Finish setting up' : 'Welcome — let’s connect your inbox';

  if (setup.step === 1) return renderSetupInbox(data);
  if (setup.step === 2) return renderSetupProfile(data);
  return renderSetupAlerts(data);
}

function renderSetupInbox(data) {
  const guess = setup.hostGuess;

  let html = '<p class="hint" style="margin:0 0 14px">Add the address recruiters email you at. You can add more later — the duplicate detection works across all of them.</p>' +
    field('suEmail', 'Email address', '', 'you@gmail.com', 'email') +
    '<button class="sm primary" id="suLookup">Continue</button>';

  if (guess) {
    const gmailOption = guess.supportsGmailApi;
    html = '<p class="hint" style="margin:0 0 14px">' +
      (guess.provider ? 'Detected <b>' + esc(guess.provider) + '</b>.' : 'Custom domain <b>' + esc(guess.domain) + '</b>.') +
      '</p>' +
      field('suEmail', 'Email address', guess.email, '', 'email');

    if (gmailOption) {
      html += '<div class="frow"><label>Connection</label><div>' +
        '<label class="radio"><input type="radio" name="suMode" value="imap"' + (guess.mode !== 'gmail' ? ' checked' : '') + '> App password <span class="hint">— simplest, works right away</span></label>' +
        '<label class="radio"><input type="radio" name="suMode" value="gmail"' + (guess.mode === 'gmail' ? ' checked' : '') + (guess.googleClientConfigured ? '' : ' disabled') + '> Gmail API' +
        '<span class="hint">' + (guess.googleClientConfigured ? ' — better labels and threading' : ' — needs a Google OAuth client (advanced)') + '</span></label>' +
        '</div></div>';
    }

    html += '<div id="suImapBlock">' +
      field('suPassword', 'App password', '', 'xxxx xxxx xxxx xxxx', 'password') +
      (guess.note ? '<p class="hint" style="margin:-4px 0 12px">' + esc(guess.note) +
        (guess.appPasswordUrl ? ' <a href="' + esc(guess.appPasswordUrl) + '" target="_blank" rel="noreferrer">Create one</a>' : '') + '</p>' : '') +
      '<details style="margin-bottom:12px"><summary class="hint">Server settings (usually correct)</summary><div style="padding-top:10px">' +
      field('suImapHost', 'IMAP host', guess.imap ? guess.imap.host : '', '') +
      field('suImapPort', 'IMAP port', guess.imap ? guess.imap.port : 993, '', 'number') +
      field('suSmtpHost', 'SMTP host', guess.smtp ? guess.smtp.host : '', '') +
      field('suSmtpPort', 'SMTP port', guess.smtp ? guess.smtp.port : 465, '', 'number') +
      '</div></details></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sm primary" id="suAddAccount">Connect inbox</button>' +
      '<button class="sm" id="suBack">Back</button></div>';
  }

  $('setup').innerHTML = html;

  const lookup = $('suLookup');
  if (lookup) {
    const go = async () => {
      const email = $('suEmail').value.trim();
      if (!email.includes('@')) { toast('Enter a full email address.'); return; }
      const result = await setupPost('suggestHosts', { email });
      if (result) { setup.hostGuess = { ...result, email }; renderSetupInbox(data); }
    };
    lookup.onclick = go;
    $('suEmail').onkeydown = (event) => { if (event.key === 'Enter') go(); };
    $('suEmail').focus();
  }

  const back = $('suBack');
  if (back) back.onclick = () => { setup.hostGuess = null; renderSetupInbox(data); };

  const modeRadios = document.querySelectorAll('input[name="suMode"]');
  const syncMode = () => {
    const gmail = document.querySelector('input[name="suMode"]:checked')?.value === 'gmail';
    const block = $('suImapBlock');
    if (block) block.hidden = gmail;
  };
  modeRadios.forEach((radio) => { radio.onchange = syncMode; });
  syncMode();

  const add = $('suAddAccount');
  if (add) {
    add.onclick = async () => {
      const gmail = document.querySelector('input[name="suMode"]:checked')?.value === 'gmail';
      const body = {
        email: $('suEmail').value.trim(),
        transport: gmail ? 'gmail' : 'imap'
      };
      if (!gmail) {
        body.password = $('suPassword').value;
        body.imapHost = $('suImapHost').value.trim();
        body.imapPort = Number($('suImapPort').value);
        body.smtpHost = $('suSmtpHost').value.trim();
        body.smtpPort = Number($('suSmtpPort').value);
        body.smtpSecure = Number($('suSmtpPort').value) === 465;
        if (!body.password) { toast('Enter the app password.'); return; }
      }

      add.disabled = true; add.textContent = 'Connecting…';
      const result = await setupPost('addAccount', body);
      add.disabled = false; add.textContent = 'Connect inbox';
      if (!result) return;

      if (result.needsGmailAuth) {
        const auth = await setupPost('gmailAuthUrl', { id: result.id });
        if (auth && auth.url) {
          window.open(auth.url, '_blank', 'noreferrer');
          toast('Approve access in the tab that opened.');
        }
      } else {
        const test = await setupPost('testAccount', { id: result.id });
        toast(test && test.ok ? 'Connected.' : 'Saved, but the connection test failed — check the password.');
      }
      if (setup.addingExtra) {
        setup.addingExtra = false;
        setup.hostGuess = null;
        $('setup').innerHTML = '';
        $('setupPanel').hidden = true;
        refresh();
      } else {
        advanceSetup(2);
      }
    };
  }
}

function renderSetupProfile(data) {
  const p = data.profile;
  $('setup').innerHTML =
    '<p class="hint" style="margin:0 0 14px">These fill the replies the agent sends. Anything you leave blank simply disables the templates that need it.</p>' +
    field('spName', 'Full name (signs every reply)', p.fullName, 'Your Name') +
    field('spPhone', 'Phone', p.phone, '(555) 010-2030', 'tel') +
    field('spCity', 'City', p.city, 'Atlanta') +
    field('spState', 'State', p.state, 'GA') +
    field('spAuth', 'Work authorization', p.workAuth, 'US Citizen') +
    field('spAvail', 'Availability', p.availability || '2 weeks from offer', '2 weeks from offer') +
    field('spRate', 'Your hourly rate', p.preferredRateHourly || '', '85', 'number') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">' +
    '<button class="sm primary" id="spSave">Save and continue</button>' +
    '<button class="sm" id="spBack">Back to inboxes</button></div>';

  $('spBack').onclick = () => advanceSetup(1);
  $('spSave').onclick = async () => {
    const name = $('spName').value.trim();
    if (!name) { toast('A full name is required — the agent will not send unsigned mail.'); return; }
    const result = await setupPost('profile', {
      fullName: name,
      phone: $('spPhone').value.trim(),
      city: $('spCity').value.trim(),
      state: $('spState').value.trim(),
      workAuth: $('spAuth').value.trim(),
      availability: $('spAvail').value.trim(),
      preferredRateHourly: Number($('spRate').value) || 0,
      contactEmail: data.accounts[0] ? data.accounts[0].email : ''
    }, 'Profile saved.');
    if (result) advanceSetup(3);
  };
}

function renderSetupAlerts(data) {
  const tokenSet = data.secretsPresent.TG_TOKEN;
  const paired = data.telegram.paired;

  let html = '<p class="hint" style="margin:0 0 14px">Telegram is how the agent reaches your phone — interview alerts, and one-tap approval of replies. Optional, but it is the point of the thing.</p>';

  if (!tokenSet) {
    html += '<ol class="steps"><li>Open Telegram and message <a href="https://t.me/botfather" target="_blank" rel="noreferrer">@BotFather</a></li>' +
      '<li>Send <code>/newbot</code> and pick any name</li>' +
      '<li>Paste the token it gives you below</li></ol>' +
      field('saToken', 'Bot token', '', '8412345678:AA…', 'password') +
      '<button class="sm primary" id="saSaveToken">Save token</button>';
  } else if (!paired) {
    html += '<p class="hint" style="margin:0 0 10px">Token saved. Now scan this with your phone — it opens your bot and pairs it automatically.</p>' +
      '<div id="saQr"></div><button class="sm primary" id="saQrBtn">Show pairing QR</button>';
  } else {
    html += '<div class="banner info" style="margin:0 0 14px"><b>Telegram connected</b>Alerts will reach your phone.</div>';
  }

  html += '<div class="frow" style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px"><label for="saKey">Claude API key <span class="hint">(optional)</span></label>' +
    '<input id="saKey" type="password" placeholder="' + (data.secretsPresent.ANTHROPIC_API_KEY ? 'already set — paste to replace' : 'sk-ant-…') + '" autocomplete="off"></div>' +
    '<p class="hint" style="margin:-4px 0 10px">Improves classification on ambiguous mail. Works fine without it — the rules handle the bulk.</p>' +
    '<button class="sm" id="saSaveKey">Save key</button>' +
    '<div style="margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="primary" id="saFinish">Finish and start watching</button>' +
    '<button class="sm" id="saBack">Back</button></div>';

  $('setup').innerHTML = html;

  const saveToken = $('saSaveToken');
  if (saveToken) saveToken.onclick = async () => {
    const value = $('saToken').value.trim();
    if (!value) { toast('Paste the token first.'); return; }
    const result = await setupPost('setSecret', { key: 'TG_TOKEN', value });
    if (result) { toast('Token saved.'); refresh(); }
  };

  const qrBtn = $('saQrBtn');
  if (qrBtn) qrBtn.onclick = async () => {
    qrBtn.disabled = true;
    const result = await setupPost('pairingLink', {});
    qrBtn.disabled = false;
    if (result && result.qrDataUrl) {
      $('saQr').innerHTML = '<img class="qr" alt="Telegram pairing QR code" src="' + result.qrDataUrl + '">' +
        '<p class="hint">Or open <a href="' + esc(result.link) + '" target="_blank" rel="noreferrer">this link</a> and press Start. Single use.</p>';
    }
  };

  $('saSaveKey').onclick = async () => {
    const value = $('saKey').value.trim();
    if (!value) { toast('Nothing to save.'); return; }
    const result = await setupPost('setSecret', { key: 'ANTHROPIC_API_KEY', value });
    if (result) { await setupPost('aiEnabled', { enabled: true }); toast('Claude classifier enabled.'); refresh(); }
  };

  $('saBack').onclick = () => advanceSetup(2);

  $('saFinish').onclick = async () => {
    const button = $('saFinish');
    button.disabled = true; button.textContent = 'Starting…';
    const result = await setupPost('startAgent', {});
    button.disabled = false; button.textContent = 'Finish and start watching';
    if (result) {
      toast('Watching your inbox. Nothing sends without your approval.');
      advanceSetup(4);
    }
  };
}

function renderOnboarding(data) {
  if (isBusy('onboarding')) return;
  const o = data.onboarding;
  const wrap = async (name, payload, message) => {
    try { await post(name, payload); toast(message); } catch (error) { toast(error.message); }
    refresh();
  };

  const dobState = !o.dobPresent
    ? 'Not set yet. Recruiters routinely need it for VMS and background-check paperwork.'
    : 'Value is set.';

  const dobInput = '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px">' +
    '<input type="text" id="dobInput" placeholder="' + (o.dobPresent ? 'already set — type to replace' : '04/12 or 04/12/1990') + '" autocomplete="off">' +
    '<button class="sm" id="dobSave">Save</button>' +
    (o.dobPresent ? '<button class="sm danger" id="dobClear">Clear</button>' : '') + '</div>';

  let ssnBlock;
  if (o.ssnMalformed) {
    ssnBlock = '<div class="banner bad" style="margin:0 0 10px"><b>That is not four digits.</b>' +
      'If you entered a full SSN, clear it — the full number is never storable or sendable. Enter only the last four.' +
      '<div style="margin-top:8px"><button class="sm danger" id="ssnClearBad">Clear it</button></div></div>';
  } else if (o.ssnAcknowledged && o.ssnPresent) {
    ssnBlock = '<div class="toggle"><div class="grow"><b>SSN last four</b>' +
      '<div class="hint">Enabled. Included when a recruiter asks for onboarding details.</div></div>' +
      '<button class="sm danger" id="ssnOffBtn">Turn off</button></div>' +
      '<div class="toggle"><div class="grow"><b>Send without asking me</b>' +
      '<div class="hint">' + (o.ssnAutoSendable
        ? 'On — onboarding replies go out unattended.'
        : 'Off — you get an approval card and see exactly what goes out. Recommended.') +
      '</div></div><input type="checkbox" id="ssnAutoBox"' + (o.ssnAutoSendable ? ' checked' : '') + '></div>';
  } else {
    ssnBlock = '<div class="toggle"><div class="grow"><b>SSN last four</b><div class="hint">' +
      (o.ssnPresent ? 'Entered but not enabled yet.' : 'Not set.') +
      '</div></div><button class="sm" id="ssnReadBtn">Review &amp; enable</button></div>' +
      '<div id="ssnNotice" hidden></div>';
  }

  $('onboarding').innerHTML =
    '<div class="toggle"><div class="grow"><b>Date of birth</b><div class="hint">' + dobState + '</div></div>' +
    '<input type="checkbox" id="dobBox"' + (o.dobEnabled ? ' checked' : '') + '></div>' +
    dobInput +
    ssnBlock +
    '<div class="hint" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">' +
    'Never storable and never sendable, whatever these are set to: full SSN, driver&rsquo;s licence, ' +
    'passport, bank or routing details. Those requests always come to you.</div>';

  const dobBox = $('dobBox');
  if (dobBox) dobBox.onchange = () => wrap('provideDateOfBirth', { enabled: dobBox.checked }, 'Saved.');

  const dobSave = $('dobSave');
  if (dobSave) dobSave.onclick = () => {
    const value = $('dobInput').value.trim();
    if (!value) { toast('Enter a date of birth first.'); return; }
    wrap('setSecret', { key: 'AIM_DATE_OF_BIRTH', value }, 'Date of birth saved.');
  };
  const dobClear = $('dobClear');
  if (dobClear) dobClear.onclick = () => wrap('clearSecret', { key: 'AIM_DATE_OF_BIRTH' }, 'Cleared.');

  const ssnClearBad = $('ssnClearBad');
  if (ssnClearBad) ssnClearBad.onclick = () => wrap('clearSecret', { key: 'AIM_SSN_LAST4' }, 'Cleared.');

  const ssnOff = $('ssnOffBtn');
  if (ssnOff) ssnOff.onclick = () => wrap('acknowledgeSsnLast4', { enabled: false }, 'SSN last four disabled.');

  const ssnAuto = $('ssnAutoBox');
  if (ssnAuto) ssnAuto.onchange = () => wrap('onboardingAutoSend', { enabled: ssnAuto.checked }, 'Saved.');

  const ssnRead = $('ssnReadBtn');
  if (ssnRead) {
    ssnRead.onclick = () => {
      // The rundown has to be on screen before the confirm button exists. Consent
      // to mail identity data should not be reachable in one click.
      const host = $('ssnNotice');
      host.hidden = false;
      host.innerHTML = '<div class="banner warn" style="margin:10px 0 0"><b>Before you turn this on</b>' +
        '<div style="white-space:pre-wrap;margin-top:6px">' + esc(o.disclaimer) + '</div>' +
        (o.ssnPresent ? '' :
          '<div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center">' +
          '<input type="password" id="ssnInput" placeholder="last four digits" maxlength="4" style="width:9em" autocomplete="off"></div>') +
        '<div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="sm primary" id="ssnConfirmBtn">I understand — enable it</button>' +
        '<button class="sm" id="ssnCancelBtn">Cancel</button></div></div>';
      ssnRead.disabled = true;
      $('ssnCancelBtn').onclick = () => { host.hidden = true; host.innerHTML = ''; ssnRead.disabled = false; };
      $('ssnConfirmBtn').onclick = async () => {
        // If the value is not stored yet, take it here — the same click that
        // consents is the only place it should be enterable.
        const input = $('ssnInput');
        if (input) {
          const value = input.value.trim();
          if (!/^\d{4}$/.test(value)) { toast('Enter exactly four digits.'); return; }
          try { await post('setSecret', { key: 'AIM_SSN_LAST4', value }); }
          catch (error) { toast(error.message); return; }
        }
        wrap('acknowledgeSsnLast4', { enabled: true, acknowledged: true }, 'SSN last four enabled.');
      };
    };
  }
}

/* ---------- boot ---------- */

async function refresh() {
  try {
    const [overview, pendingRows, stream, dupes, subs] = await Promise.all([
      get('overview'),
      get('pending'),
      get('recentMessages?limit=120' + (state.streamCat ? '&category=' + encodeURIComponent(state.streamCat) : '')),
      get('duplicates'),
      get('submissions')
    ]);
    state.overview = overview;
    renderHeader(overview); renderBanners(overview); renderTiles(overview);
    renderSetup(overview);
    renderAccounts(overview); renderTelegram(overview); renderPolicy(overview); renderTemplates(overview);
    renderOnboarding(overview);
    renderPending(pendingRows); renderStream(stream); renderDupes(dupes); renderSubs(subs);
  } catch (error) {
    $('banners').innerHTML = '<div class="banner bad"><b>Dashboard could not load</b>' + esc(error.message) + '</div>';
  }
}

$('pauseBtn').onclick = async () => {
  const paused = state.overview?.config?.paused;
  try { await post(paused ? 'resume' : 'pause'); toast(paused ? 'Resumed.' : 'Paused — nothing will be sent.'); }
  catch (error) { toast(error.message); }
  refresh();
};

$('runBtn').onclick = async () => {
  $('runBtn').disabled = true; $('runBtn').textContent = 'Checking…';
  try {
    const result = await post('runOnce');
    toast('Checked. ' + result.processed + ' new message(s) handled.');
  } catch (error) { toast('Failed: ' + error.message); }
  $('runBtn').disabled = false; $('runBtn').textContent = 'Check mail now';
  refresh();
};

/**
 * Tab switching. The active tab is remembered so the 15-second refresh cannot
 * bounce you back to Inbox while you are half-way through changing a setting.
 */
function showTab(name) {
  state.tab = name;
  try { localStorage.setItem('aim.tab', name); } catch { /* private mode */ }
  document.querySelectorAll('#tabs button').forEach((button) => {
    button.classList.toggle('on', button.dataset.tab === name);
  });
  document.querySelectorAll('.view').forEach((view) => {
    view.classList.toggle('on', view.dataset.view === name);
  });
}

$('tabs').onclick = (event) => {
  const button = event.target.closest('button[data-tab]');
  if (button) showTab(button.dataset.tab);
};

try {
  const saved = localStorage.getItem('aim.tab');
  if (saved && document.querySelector('.view[data-view="' + saved + '"]')) showTab(saved);
} catch { /* private mode */ }

$('streamTabs').onclick = (event) => {
  const button = event.target.closest('button[data-cat]');
  if (!button) return;
  state.streamCat = button.dataset.cat;
  document.querySelectorAll('#streamTabs button').forEach((node) => node.setAttribute('aria-pressed', String(node === button)));
  refresh();
};

renderProfile();
refresh();
timer = setInterval(refresh, 15000);
document.addEventListener('visibilitychange', () => {
  clearInterval(timer);
  if (!document.hidden) { refresh(); timer = setInterval(refresh, 15000); }
});
</script>
