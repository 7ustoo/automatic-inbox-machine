name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Tests
        # No .env exists in CI, which is the point: the suite must pass with no
        # credentials present, proving nothing under test reaches the network.
        run: npm test

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: No secrets or user state committed
        run: |
          set -e
          for path in .env config.json data logs google-oauth-client.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked by git and must not be"
              exit 1
            fi
          done
          echo "No secrets or user state tracked."

      - name: Auto-send ships disabled
        # A release that defaults to sending mail without asking would be a
        # different product. Fail the build rather than trust review to catch it.
        run: node .github/check-defaults.mjs

      - name: Version is single-sourced
        run: |
          set -e
          PKG=$(node -p "require('./package.json').version")
          if ! grep -q "\[$PKG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version $PKG"
            exit 1
          fi
          echo "package.json $PKG is documented in CHANGELOG.md"
