name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag being built, e.g. v1.2.0. Blank builds the current branch.'
        required: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: wrapper/go.mod
          cache-dependency-path: wrapper/go.sum

      - name: Install dependencies
        # `npm ci` output ships inside the installer, so this is the build of the
        # node_modules the user will actually run. Every dep is pure JS.
        run: npm ci --no-audit --no-fund

      - name: Bundle Google OAuth client (when configured)
        # Same pattern as AMM: repo secrets become scripts/google-oauth-client.json
        # in the payload, which is what makes "Sign in with Google" work in an
        # installed copy. Gracefully absent when the secrets are not set — the
        # app-password path still works, the sign-in option just stays off.
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            node -e "require('fs').writeFileSync('scripts/google-oauth-client.json', JSON.stringify({clientId:process.env.GOOGLE_OAUTH_CLIENT_ID, clientSecret:process.env.GOOGLE_OAUTH_CLIENT_SECRET||''}))"
            echo "Google OAuth client bundled."
          else
            echo "No GOOGLE_OAUTH_CLIENT_ID secret — Sign in with Google will be unavailable in this build."
          fi

      - name: Tests
        run: npm test

      - name: Safe-defaults guardrail
        run: node .github/check-defaults.mjs

      - name: Generate icon
        # Committed too, but regenerating proves the generator still works and
        # that what ships matches the source. Must run before the Go build — the
        # wrapper embeds logo.ico and go-winres reads logo.png.
        run: node scripts/build/make-icon.mjs

      - name: Vet the wrapper
        working-directory: wrapper
        run: go vet ./...

      - name: Build AIM.exe
        shell: bash
        working-directory: wrapper
        run: |
          set -e
          VERSION=$(node -p "require('../package.json').version")
          echo "Building AIM.exe v$VERSION"
          node ../scripts/build/sync-winres.mjs
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json
          mkdir -p dist
          # -H windowsgui is what makes this an application rather than a console
          # program. Without it every launch shows a black console window.
          go build -ldflags="-H windowsgui -s -w -X main.AIMVersion=$VERSION" -o dist/AIM.exe .
          ls -la dist/

      - name: Sign AIM.exe (best-effort)
        # SmartScreen needs BOTH binaries signed: the app itself here, and the
        # setup .exe after Inno packages it. The script skips itself with a
        # warning when the AZURE_* secrets are absent, so unsigned releases keep
        # working — with the SmartScreen prompt — until a Trusted Signing
        # account exists and the five secrets are set.
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          if ($env:AZURE_CLIENT_ID) { dotnet tool install --global azuresigntool | Out-Null }
          pwsh scripts/build/sign-windows.ps1 wrapper/dist/AIM.exe

      - name: Bundle Microsoft WebView2 bootstrapper
        # The native window needs the Evergreen runtime. Verify Microsoft's
        # Authenticode signature before this executable is allowed into an
        # installer other people will run.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          $dest = 'runtime\MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $dest

          $sig = Get-AuthenticodeSignature $dest
          if ($sig.Status -ne 'Valid') { Write-Error "WebView2 signature is $($sig.Status)"; exit 1 }
          if ($sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            Write-Error "Unexpected WebView2 signer: $($sig.SignerCertificate.Subject)"; exit 1
          }
          Write-Host "Verified signer: $($sig.SignerCertificate.Subject)"

      - name: Bundle portable Node runtime
        shell: powershell
        env:
          NODE_VERSION: '22.20.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver  = $env:NODE_VERSION
          $base = "https://nodejs.org/dist/v$ver"
          $zip  = "node-v$ver-win-x64.zip"

          Write-Host "Downloading $base/$zip"
          Invoke-WebRequest -Uri "$base/$zip" -OutFile $zip

          # Verify against Node's own published checksums before this binary is
          # allowed into an installer other people will run.
          Invoke-WebRequest -Uri "$base/SHASUMS256.txt" -OutFile SHASUMS256.txt
          $expected = ((Select-String -Path SHASUMS256.txt -Pattern ([regex]::Escape($zip))).Line -split '\s+')[0].ToLower()
          $actual   = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "Node checksum mismatch: $actual != $expected"; exit 1 }
          Write-Host "Checksum OK: $actual"

          Expand-Archive -Path $zip -DestinationPath node-extract -Force
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          Copy-Item (Join-Path "node-extract\node-v$ver-win-x64" "node.exe") "runtime\node.exe"
          Remove-Item $zip, SHASUMS256.txt, node-extract -Recurse -Force
          Write-Host "Bundled runtime: $(& 'runtime\node.exe' --version)"

      - name: Scrub user state from the installer payload
        # npm test creates config.json and data\*.jsonl as side effects. The .iss
        # excludes them, but scrub here too — if either ever rides into the
        # payload with `ignoreversion` it overwrites a real user's settings and
        # dedupe ledger on upgrade. Belt AND suspenders; this class of bug must
        # not come back.
        shell: powershell
        run: |
          foreach ($path in @('config.json', '.env', 'data', 'logs')) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force; Write-Host "removed $path" }
          }

      - name: Verify the bundled runtime and the app binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Read the embedded version resource rather than running the binary with
          # --version: it is built with -H windowsgui, so it has no stdout attached
          # to a parent console and captured output cannot be relied on. This also
          # proves go-winres actually embedded the resource.
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'wrapper\dist\AIM.exe'))
          Write-Host "AIM.exe: $($info.ProductName) / file $($info.FileVersion) / product $($info.ProductVersion)"
          if (-not $info.ProductVersion.StartsWith($expected)) {
            Write-Error "AIM.exe reports product version '$($info.ProductVersion)' but package.json says '$expected'"
            exit 1
          }
          if ($info.ProductName -ne 'Automatic Inbox Machine') {
            Write-Error "AIM.exe is missing its version resource"; exit 1
          }

          & 'runtime\node.exe' scripts/check-syntax.mjs
          if ($LASTEXITCODE -ne 0) { Write-Error "check-syntax failed under the bundled runtime"; exit 1 }

          # --status exits 1 when nothing is running, which is the correct answer
          # on a build agent. Only a code above 1 means the module graph failed to
          # load. The explicit `exit 0` below is required: GitHub's PowerShell
          # wrapper appends `exit $LASTEXITCODE`, so this step would inherit the 1
          # from a perfectly successful check.
          & 'runtime\node.exe' scripts/app.mjs --status
          $statusCode = $LASTEXITCODE
          if ($statusCode -gt 1) { Write-Error "app.mjs --status failed with $statusCode"; exit 1 }

          Write-Host "Bundled runtime loads the app cleanly."
          exit 0

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Building installer for version $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\aim.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit 1 }
          Get-ChildItem installer\dist\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Sign the installer (best-effort)
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          $exe = (Get-ChildItem installer/dist/*.exe | Select-Object -First 1).FullName
          pwsh scripts/build/sign-windows.ps1 $exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aim-windows
          path: installer/dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage release assets
        env:
          RELEASES_REPO: 7ustoo/automatic-inbox-machine-releases
        run: |
          set -e
          mkdir -p release
          find artifacts/aim-windows -type f -name '*.exe' -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          INSTALLER="$(basename "$(find release -type f -name '*.exe' -print -quit)")"
          SHA256="$(awk -v file="$INSTALLER" '$2 == file {print $1}' release/SHA256SUMS.txt)"
          INSTALLER="$INSTALLER" SHA256="$SHA256" node -e "const fs=require('fs'); const repo=process.env.RELEASES_REPO; const tag=process.env.GITHUB_REF_NAME; const version=tag.replace(/^v/,''); const name=process.env.INSTALLER; const base='https://github.com/'+repo+'/releases/download/'+tag; fs.writeFileSync('release/latest.json', JSON.stringify({version,publishedAt:new Date().toISOString(),releaseUrl:'https://github.com/'+repo+'/releases/tag/'+tag,installer:{name,url:base+'/'+name,sha256:process.env.SHA256},checksumsUrl:base+'/SHA256SUMS.txt',notes:'Automatic Inbox Machine '+tag},null,2)+'\n')"
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: 7ustoo/automatic-inbox-machine-releases
          token: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Download

            | Platform | Asset | How to install |
            |---|---|---|
            | Windows 10/11 (x64) | `aim-setup-v*.exe` | Double-click. Accept the SmartScreen prompt ("More info" → "Run anyway") — the installer is unsigned. No admin needed. |
            | macOS / Linux | — | Use the git install: `npm install && npm run setup`. See the README. |

            The Windows installer bundles its own Node runtime, so you do not need
            Node installed. It installs to `%LOCALAPPDATA%\automatic-inbox-machine`,
            adds Start Menu and optional desktop shortcuts, and registers startup
            tasks so the agent watches your mail after a reboot.

            ### First run

            The dashboard opens on its setup panel. Add your inboxes, fill in the
            reply profile, then use **Check mail now** for a read-only pass before
            enabling anything that sends. Auto-send ships **off** on purpose.

            You will need a Telegram bot token from
            [@BotFather](https://t.me/botfather) in `.env` to get alerts on your
            phone — the dashboard shows a pairing QR so you never look up a chat ID.

            ### Upgrading

            Install over the top. Your `config.json`, `.env`, and `data/` ledger are
            preserved; the installer stops the running agent first so files are not
            locked mid-copy.

            ### Verification

            `SHA256SUMS.txt` lists checksums for every asset.
